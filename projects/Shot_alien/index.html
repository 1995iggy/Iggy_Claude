<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>狙击外星人 v2.8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:crosshair}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .35s;background:rgba(0,0,0,.88)}
.overlay.hidden{opacity:0;pointer-events:none}
.menu-title{font:bold 54px/1.2 "Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#ff6b35,#ff4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:8px;margin-bottom:4px}
.menu-sub{color:#8899bb;font:16px/1.5 "Microsoft YaHei",sans-serif;margin-bottom:16px;text-align:center}
.menu-controls{color:#556688;font:13px/1.9 "Microsoft YaHei",sans-serif;margin-bottom:24px;text-align:center}
.menu-controls span{color:#99bbdd;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:3px}
.menu-btn{padding:12px 46px;font:bold 18px "Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#ff6b35,#d4420a);border:2px solid rgba(255,150,100,.4);border-radius:8px;color:#fff;cursor:pointer;transition:all .2s;letter-spacing:4px;box-shadow:0 0 20px rgba(255,100,50,.15);margin:6px}
.menu-btn:hover{background:linear-gradient(180deg,#ff7b45,#e5521a);transform:scale(1.04);box-shadow:0 0 40px rgba(255,100,50,.3)}
.menu-btn:active{transform:scale(.96)}
.menu-btn.sm{padding:8px 24px;font-size:15px;letter-spacing:2px}
.menu-btn.outline{background:transparent;border:1px solid rgba(255,255,255,.25);color:#aabbcc;box-shadow:none}
.menu-btn.outline:hover{background:rgba(255,255,255,.06);transform:scale(1.04)}
.menu-btn.on{background:linear-gradient(180deg,#35b035,#0a8020);border-color:rgba(100,255,100,.4);color:#fff}
.menu-btn.off{background:linear-gradient(180deg,#555,#333);border-color:rgba(150,150,150,.3);color:#999}
.menu-footer{color:#3a4a6a;font:12px "Microsoft YaHei",sans-serif;margin-top:24px}

.settings-title{font:bold 36px "Microsoft YaHei",sans-serif;color:#ff6b35;letter-spacing:6px;margin-bottom:20px}
.settings-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.settings-row label{color:#8899bb;font:14px "Microsoft YaHei",sans-serif;width:100%;text-align:center;margin:4px 0 0}
.settings-divider{width:200px;height:1px;background:rgba(255,255,255,.06);margin:16px 0}

.result-title{font:bold 46px "Microsoft YaHei",sans-serif;margin-bottom:8px;letter-spacing:4px}
.result-score{font:26px "Microsoft YaHei",sans-serif;color:#fff;margin-bottom:4px}
.result-detail{font:16px "Microsoft YaHei",sans-serif;color:#8899bb;margin-bottom:6px}
.result-stars{margin-bottom:12px;font-size:36px;letter-spacing:6px}
.result-sub{font:14px "Microsoft YaHei",sans-serif;color:#556688;margin-bottom:24px}

.level-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-60%);z-index:90;pointer-events:none;text-align:center;opacity:0;transition:all .5s cubic-bezier(.4,0,.2,1)}
.level-toast.show{opacity:1;transform:translate(-50%,-50%)}
.level-toast .name{font:bold 42px "Microsoft YaHei",sans-serif;color:#ff6b35;text-shadow:0 0 50px rgba(255,100,50,.5);letter-spacing:8px}
.level-toast .wave{font:20px "Microsoft YaHei",sans-serif;color:#88aacc;margin-top:8px;letter-spacing:2px}

.reload-hint{position:fixed;bottom:15%;left:50%;transform:translateX(-50%);color:#ff4444;font:bold 18px "Microsoft YaHei",sans-serif;z-index:60;pointer-events:none;opacity:0;transition:opacity .3s}
.reload-hint.show{opacity:1}
.sniper-hint{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);color:#88aacc;font:15px "Microsoft YaHei",sans-serif;z-index:60;pointer-events:none;opacity:0;transition:opacity .4s}
.sniper-hint.show{opacity:1}

.corner-btns{position:fixed;top:52px;right:8px;z-index:80;display:flex;gap:6px}
.corner-btn{width:36px;height:36px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:50%;color:#aaccdd;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.corner-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);transform:scale(1.08)}
.corner-btn.help-btn{border-color:rgba(255,180,50,.4);color:#ffb832;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(255,180,50,.2)}50%{box-shadow:0 0 14px rgba(255,180,50,.5)}}
.help-panel{position:fixed;right:12px;top:96px;z-index:95;width:280px;background:rgba(20,20,35,.95);border:1px solid rgba(255,180,50,.3);border-radius:12px;padding:20px;color:#ccc;font:14px "Microsoft YaHei",sans-serif;display:none;text-align:center}
.help-panel.show{display:block}
.help-panel h3{color:#ffb832;font-size:18px;margin-bottom:12px}
.help-panel .pay-row{display:flex;gap:12px;margin:12px 0;justify-content:center}
.help-panel .pay-btn{flex:1;padding:10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;text-align:center;transition:all .2s;font:13px "Microsoft YaHei",sans-serif}
.help-panel .pay-btn:hover{background:rgba(255,255,255,.12);transform:scale(1.03)}
.help-panel .pay-btn.wechat{background:rgba(7,193,96,.15);border-color:rgba(7,193,96,.3)}
.help-panel .pay-btn.alipay{background:rgba(22,119,255,.15);border-color:rgba(22,119,255,.3)}
.help-panel .price{font-size:20px;font-weight:bold;color:#ffb832;margin:4px 0}
.help-panel .qr-placeholder{width:120px;height:120px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.15);margin:8px auto;display:flex;align-items:center;justify-content:center;color:#556;font:12px "Microsoft YaHei",sans-serif;border-radius:6px}
.help-panel .close-help{position:absolute;top:8px;right:10px;background:none;border:none;color:#8899bb;font-size:16px;cursor:pointer}
.help-panel .helper-desc{color:#889;font-size:12px;line-height:1.6;margin:8px 0}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="level-toast" id="levelToast"><div class="name" id="toastName"></div><div class="wave" id="toastWave"></div></div>
<div class="reload-hint" id="reloadHint">弹药耗尽 · 按 R 装弹</div>
<div class="sniper-hint" id="sniperHint">按 T 键切换狙击镜</div>

<div class="corner-btns" id="cornerBtns">
  <button class="corner-btn help-btn" id="helpBtn" title="寻求帮助">?</button>
  <button class="corner-btn" id="settingsBtn" title="设置">*</button>
</div>

<div class="help-panel" id="helpPanel">
  <button class="close-help" id="closeHelp">x</button>
  <h3>寻求帮助</h3><p class="helper-desc">花点小钱获取提示<br>收款接口待配置</p>
  <div class="pay-row">
    <button class="pay-btn wechat" id="payWx"><div>微信支付</div><div class="price">2.99</div></button>
    <button class="pay-btn alipay" id="payAli"><div>支付宝</div><div class="price">2.99</div></button>
  </div>
  <div class="qr-placeholder">收款二维码<br>接口预留</div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="menu-title">狙 击 外 星 人</div>
  <div class="menu-sub">扫描区域 · 发现目标 · 一枪毙敌</div>
  <div class="menu-controls"><span>鼠标</span> 环视 · <span>滚轮</span> 缩放 · <span>T</span> 切换镜 · <span>左键</span> 射击<br><span>R</span> 装弹 · <span>Shift</span> 屏息 · <span>ESC</span> 设置 · <span>H</span> 帮助</div>
  <button class="menu-btn" id="startBtn">开 始 任 务</button>
  <div class="menu-footer">— 消灭所有外星人，即可通关 —</div>
</div>

<div class="overlay hidden" id="gameOverlay">
  <div class="result-title" style="color:#ff4444">任务失败</div>
  <div class="result-stars" id="goStars"></div><div class="result-score" id="goScore"></div>
  <div class="result-detail" id="goDetail"></div><div class="result-sub">未消灭目标已标记</div>
  <button class="menu-btn" id="retryBtn">重来当前关</button>
  <button class="menu-btn outline" id="retryHomeBtn">返回主页</button>
</div>

<div class="overlay hidden" id="winOverlay">
  <div class="result-title" style="color:#ffcc00">任 务 完 成</div>
  <div class="result-stars" id="winStars"></div><div class="result-score" id="winScore"></div>
  <div class="result-detail" id="winDetail"></div><div class="result-sub">你是最顶尖的狙击手</div>
  <button class="menu-btn" id="againBtn">再 玩 一 次</button>
</div>

<div class="overlay hidden" id="settingsOverlay">
  <div class="settings-title">设 置</div>
  <div class="settings-row"><label>音效</label><button class="menu-btn sm on" id="sndToggle">开启</button></div>
  <div class="settings-row"><label>背景音乐</label><button class="menu-btn sm on" id="bgmToggle">开启</button></div>
  <div class="settings-row"><label>背景音乐音量</label><input type="range" id="bgmVolume" min="0" max="100" value="40" style="width:160px"></div>
  <div class="settings-row"><label>震动反馈</label><button class="menu-btn sm off" id="vibToggle">关闭</button></div>
  <div class="settings-divider"></div>
  <div class="settings-row">
    <button class="menu-btn sm" id="contBtn">继续游戏</button>
    <button class="menu-btn sm outline" id="restartBtn">重来当前关</button>
    <button class="menu-btn sm outline" id="homeBtn">返回主页</button>
  </div>
  <div class="settings-divider"></div>
  <div style="color:#556688;font:13px 'Microsoft YaHei',sans-serif;text-align:center">开发者: iggy<br>v2.8 · 2026</div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CFG={WORLD_W:2400,WORLD_H:800};
const W2=()=>W/2,H2=()=>H/2;
let W,H,AC=null;
const SET={sound:true,bgm:true,bgmVolume:0.4,vibration:false};

// ============================================================
// ALIEN SPRITE
// ============================================================
let alienSprite=null;
function loadAlienSprite(cb){
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const cx=c.getContext('2d');cx.drawImage(img,0,0);const d=cx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4){if(d.data[i]<35&&d.data[i+1]<35&&d.data[i+2]<35)d.data[i+3]=0;}
    cx.putImageData(d,0,0);alienSprite=c;if(cb)cb();
  };
  img.onerror=()=>{if(cb)cb();};
  img.src='参考外星人.png';
}

// ============================================================
// BACKGROUND IMAGES
// ============================================================
const bgImages={};
function loadBgImages(cb){
  const files=['游戏背景1.png','游戏背景2.png','游戏背景3.png'];
  let loaded=0;
  files.forEach(fn=>{
    const img=new Image();
    img.onload=()=>{
      bgImages[fn]=img;
      if(++loaded>=files.length&&cb)cb();
    };
    img.onerror=()=>{
      if(++loaded>=files.length&&cb)cb();
    };
    img.src=fn;
  });
}

// ============================================================
// LEVELS (simplified for debugging)
// ============================================================
const LV=[
  {name:'城市街道',bg:'游戏背景1.png',cols:['#3b3b4e','#2d2d44','#ffff66'],spd:1},
  {name:'公园绿地',bg:'游戏背景2.png',cols:['#2a4a2a','#3a5a3a','#ffff66'],spd:1.15},
  {name:'森林深处',bg:'游戏背景3.png',cols:['#1a2a14','#2a3a24','#ffff66'],spd:1.35},
];

// ============================================================
// DOM
// ============================================================
const $=id=>document.getElementById(id);
const CV=$('game'),CX=CV.getContext('2d');
const ov={menu:$('menuOverlay'),go:$('gameOverlay'),win:$('winOverlay'),settings:$('settingsOverlay')};
const T={el:$('levelToast'),name:$('toastName'),wave:$('toastWave')};
const helpPanel=$('helpPanel');
let settingsOpen=false,helpOpen=false;

// ============================================================
// STATE — core counters
// ============================================================
const S={
  phase:'menu',mode:'overview',
  score:0,lives:5,combo:0,killsInWave:0,killsTotal:0,shots:0,
  levelIdx:0,wave:1,lastWave:1,
  ammo:8,reloading:0,startTime:0,gameTime:0,timeLeft:300,
  cx:1200,cy:380,zoom:1,tcx:1200,tcy:380,tzoom:1,
  recoilX:0,recoilY:0,muzzle:0,breath:3500,holdingBreath:0,
  aliens:[],fx:[],hits:[],peds:[],cars:[],
  mx:0,my:0,cheatActive:0,misses:0,
  paused:0,waveTimer:0,
  aliensRemaining:0,waveTotal:0,
  waveCleared:false,showHelpAliens:false,
  debugMsg:'',
};
function resetCounters(){
  S.score=0;S.lives=5;S.combo=0;S.killsInWave=0;S.killsTotal=0;S.shots=0;S.misses=0;
  S.levelIdx=0;S.wave=1;S.ammo=8;S.reloading=0;
  S.startTime=Date.now();S.gameTime=0;S.timeLeft=300;
  S.recoilX=0;S.recoilY=0;S.muzzle=0;S.breath=3500;S.holdingBreath=0;
  S.cheatActive=0;S.aliensRemaining=0;S.waveTimer=0;S.waveCleared=false;S.waveTotal=0;S.showHelpAliens=false;
  S.aliens=[];S.fx=[];S.hits=[];S.peds=[];S.cars=[];
  S.paused=1;
  S.cx=1200;S.cy=380;S.zoom=1;S.tcx=1200;S.tcy=380;S.tzoom=1;
  S.debugMsg='';
}

// ============================================================
// AUDIO
// ============================================================
function play(id){if(!SET.sound)return;
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const a=AC,t=a.currentTime;
    const osc=(f,e,v,d,ty='sine',dl=0)=>{const o=a.createOscillator();o.type=ty;o.frequency.setValueAtTime(f,t+dl);if(e)o.frequency.exponentialRampToValueAtTime(e,t+dl+d);const g=a.createGain();g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.001,t+dl+d);o.connect(g);g.connect(a.destination);o.start(t+dl);o.stop(t+dl+d+.01);};
    const noise=(v,d,dl=0)=>{const len=a.sampleRate*d;if(len<=0||len>96000)return;const b=a.createBuffer(1,len,a.sampleRate),buf=b.getChannelData(0);for(let i=0;i<len;i++)buf[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const n=a.createBufferSource();n.buffer=b;const g=a.createGain();g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.001,t+dl+d);n.connect(g);g.connect(a.destination);n.start(t+dl);};
    if(id==='shot'){osc(120,30,.2,.18,'sawtooth');noise(.1,.08);}else if(id==='hit')osc(600,200,.15,.18);else if(id==='scream'){osc(800,100,.1,.25,'sawtooth');osc(600,80,.08,.3,'square',.05);noise(.06,.15,.1);}else if(id==='miss')osc(180,180,.06,.07);else if(id==='reload'){for(let i=0;i<3;i++)osc(600+i*100,0,.04,.05,'square',i*.07);}else if(id==='combo')osc(880,1100,.08,.12);else if(id==='fail'){for(let i=0;i<4;i++)osc(300-i*50,0,.08,.15,'sawtooth',i*.18);}else if(id==='win')osc(523,0,.1,.28);else if(id==='tick'){osc(800,800,.05,.05);}
  }catch(e){}
}
function vibe(){if(!SET.vibration)return;try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}}

// ============================================================
// BACKGROUND MUSIC
// ============================================================
let bgmAudio=null;
const BGM_FILES=[
  '《低频轰鸣下的危险暗涌》开心的蓝莓果冻.mp3',
  '《机械轰鸣下的危险警报》开心的蓝莓果冻.mp3',
  '《狙击潜行：外星踪迹的紧张对峙》开心的蓝莓果冻.mp3',
  '《狙击潜行：暗影中的外星猎杀》开心的蓝莓果冻.mp3'
];
function startBGM(levelIdx=0){
  if(!SET.bgm||!SET.sound)return;
  stopBGM();
  try{
    const audio=new Audio();
    audio.src=BGM_FILES[Math.min(levelIdx,BGM_FILES.length-1)];
    audio.loop=true;
    audio.volume=SET.bgmVolume;
    audio.addEventListener('error',()=>{console.log('BGM load failed');});
    audio.addEventListener('loadedmetadata',()=>{audio.play().catch(()=>{});});
    audio.play().catch(()=>{});
    bgmAudio=audio;
  }catch(e){console.log('BGM error:',e);}
}
function stopBGM(){
  if(!bgmAudio)return;
  try{
    bgmAudio.pause();
    bgmAudio.currentTime=0;
    bgmAudio=null;
  }catch(e){}
}


// ============================================================
// COORDS
// ============================================================
function w2s(x,y){return{x:(x-S.cx)*S.zoom+W/2,y:(y-S.cy)*S.zoom+H/2}}
function s2w(x,y){return{x:(x-W/2)/S.zoom+S.cx,y:(y-H/2)/S.zoom+S.cy}}

// ============================================================
// SPAWN
// ============================================================
function buildSpots(lv){
  const sp=[],margin=100;
  for(let i=0;i<50;i++){
    const x=margin+Math.random()*(CFG.WORLD_W-margin*2);
    const y=margin+Math.random()*(CFG.WORLD_H-margin*2);
    sp.push({x:x,y:y,sc:.5+Math.random()*.5});
  }
  return sp;
}
function spawnAliens(n){
  const l=LV[S.levelIdx],sp=buildSpots(l);
  if(!sp.length)return;
  const ct=Math.min(n,sp.length);
  S.aliens=[];S.killsInWave=0;
  for(let i=0;i<ct;i++){
    const s=sp[Math.floor(Math.random()*sp.length)],ci=Math.floor(Math.random()*l.cols.length),easy=ci===l.cols.length-1;
    S.aliens.push({x:s.x,y:s.y,sc:s.sc,color:l.cols[ci],easy,alive:true,die:0,peek:Math.random()*6.28,peekSp:(.008+Math.random()*.012)*l.spd,peekAm:easy?.4+Math.random()*.3:.15+Math.random()*.2,eye:Math.random()*6.28,move:Math.random()>.6?5+Math.random()*15:0,movePh:Math.random()*6.28,moveSp:.002+.003*Math.random(),bx:s.x,by:s.y});
  }
  S.aliensRemaining=ct;S.waveTotal=ct;
  S.debugMsg='spawned '+ct+' aliens';
  console.log('SPAWNED '+ct+' aliens for wave '+S.wave);
}

// ============================================================
// SHOOT
// ============================================================
function shoot(){
  if(S.phase!=='playing'||S.paused||S.reloading||settingsOpen||helpOpen)return;
  if(S.ammo<=0){reload();return;}
  S.ammo--;S.shots++;S.muzzle=10;play('shot');vibe();
  S.recoilY=-8+3*(Math.random()-.5);S.recoilX=3*(Math.random()-.5);
  const cw=s2w(W/2,H/2);let hit=false;
  for(let i=S.aliens.length-1;i>=0;i--){
    const a=S.aliens[i];if(!a.alive)continue;
    const d=Math.hypot(cw.x-a.x,cw.y-a.y);
    if(d<(12*a.sc)*(.5+.5*Math.min(S.zoom/2.5,1))){
      a.alive=false;a.die=30;hit=true;
      S.killsInWave++;S.killsTotal++;S.combo++;
      const pts=Math.round((a.easy?100:200)*(1+(S.combo-1)*.5));S.score+=pts;
      play('hit');play('scream');if(S.combo>=3)play('combo');
      const sw=w2s(a.x,a.y);
      for(let j=0;j<20;j++){const ang=Math.random()*6.28,spd=.5+Math.random()*4;S.fx.push({x:sw.x,y:sw.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,life:1,dec:.012+.02*Math.random(),color:a.color,sz:1.5+Math.random()*2.5});}
      S.hits.push({x:sw.x,y:sw.y,t:a.easy?`+${pts}`:`+${pts}`,c:a.easy?'#88ff88':'#ffcc00',life:1,vy:-1.2});
      S.aliens.splice(i,1);
      S.aliensRemaining--;
      console.log('KILLED alien! remaining='+S.aliensRemaining+' ali='+S.aliens.length);
      if(S.aliensRemaining<=0){
        console.log('ALL ALIENS DEAD! waveCleared=true');
        S.debugMsg='ALL DEAD! switching in 30f';
        S.waveTimer=30;S.paused=1;S.waveCleared=true;
      }
      break;
    }
  }
  if(!hit){S.combo=0;play('miss');if(++S.misses>=5){S.misses=0;S.lives--;play('fail');if(S.lives<=0)gameOver();}}
  if(S.ammo<=0&&!S.reloading)reload();
}
function reload(){if(S.reloading)return;S.reloading=1;$('reloadHint').classList.add('show');play('reload');setTimeout(()=>{S.ammo=8;S.reloading=0;$('reloadHint').classList.remove('show');},1500);}

// ============================================================
// WAVE TRANSITION
// ============================================================
function clearWave(){
  console.log('clearWave ENTERED phase='+S.phase+' wave='+S.wave);
  if(S.phase!=='playing'){console.log('clearWave REJECTED');return;}
  S.wave++;
  S.timeLeft=300;
  console.log('clearWave wave now='+S.wave);

    S.levelIdx++;
    S.wave=1;
    if(S.levelIdx>=LV.length){
      gameWin();
      return;
    }
    startBGM(S.levelIdx);
  }
  startWave();
}

function drawBuilding(b){const sx=CFG.WORLD_W/1200,sy=CFG.WORLD_H/800,bx=b.x*sx,by=b.y*sy,bw=b.w*sx,bh=b.h*sy;
  CX.fillStyle=b.c;CX.fillRect(bx,by,bw,bh);
  if(b.win){const r=Math.floor(b.h/48),c=Math.floor((b.w-20)/34);for(let i=0;i<r;i++)for(let j=0;j<c;j++){const wx=(b.x+14+j*34)*sx,wy=(b.y+16+i*48)*sy,ww=16*sx,wh=20*sy;CX.fillStyle=((i+j)%4)<1?'rgba(255,220,100,.3)':'rgba(20,20,40,.5)';CX.fillRect(wx,wy,ww,wh);}}
  if(b.shop){CX.fillStyle='#cc4444';CX.beginPath();CX.moveTo(bx-5,by+bh-10);CX.lineTo(bx+bw/2,by+bh-30);CX.lineTo(bx+bw+5,by+bh-10);CX.fill();}
}
function drawTree(t){const sx=CFG.WORLD_W/1200,sy=CFG.WORLD_H/800,tx=t.x*sx,ty=t.y*sy;
  CX.fillStyle='#3a2a1a';CX.fillRect(tx-5*sx,ty+t.r*.2*sy,10*sx,t.r*.4*sy);

}
function drawBush(b){const sx=CFG.WORLD_W/1200,sy=CFG.WORLD_H/800,bx=b.x*sx,by=b.y*sy,br=b.r*sx;CX.fillStyle='#2a6a2a';CX.beginPath();CX.arc(bx,by,br,0,6.2832);CX.fill();CX.fillStyle='#1a5a1a';CX.beginPath();CX.arc(bx+br*.3,by-br*.12,br*.55,0,6.2832);CX.fill();}

// ============================================================
// DRAW — ALIENS, OVERVIEW, SCOPE
// ============================================================
function drawAliens(){
  for(let i=S.aliens.length-1;i>=0;i--){const a=S.aliens[i];
    if(!a.alive){if(a.die>0){CX.save();CX.globalAlpha=a.die/30*.6;if(alienSprite)CX.drawImage(alienSprite,a.x-18,a.y-a.die*.3-18,36,36);CX.restore();a.die--;}continue;}
    a.peek+=a.peekSp;const peek=Math.sin(a.peek)*a.peekAm;if(a.move){a.movePh+=a.moveSp;a.x=a.bx+Math.sin(a.movePh)*a.move*peek;}a.eye+=.025;
    const s=18*a.sc;CX.save();CX.translate(a.x,a.y);let al=a.easy?.7+peek*.25:.3+peek*.4;al=Math.max(.2,Math.min(.95,al));CX.globalAlpha=al;
    if(alienSprite){
      CX.drawImage(alienSprite,-s,-s,s*2,s*2);
    }else{
      const bodyH=s*1.2,bodyW=s*0.6;
      CX.fillStyle=a.color;
      CX.beginPath();CX.ellipse(0,s*0.3,bodyW,bodyH,0,0,6.2832);CX.fill();
      CX.beginPath();CX.ellipse(0,-s*0.4,s*0.7,s*0.55,0,0,6.2832);CX.fill();
      
      const armSwing=Math.sin(Date.now()/500)*0.3;
      CX.strokeStyle=a.color;CX.lineWidth=s*0.15;
      CX.beginPath();CX.moveTo(-bodyW*0.8,s*0.1);CX.lineTo(-s*1.3,s*0.4+armSwing*s);CX.stroke();
      CX.beginPath();CX.moveTo(bodyW*0.8,s*0.1);CX.lineTo(s*1.3,s*0.4-armSwing*s);CX.stroke();
      
      const legSwing=Math.sin(Date.now()/400)*0.3;
      CX.beginPath();CX.moveTo(-s*0.2,s*1.4);CX.lineTo(-s*0.5,s*2.1+legSwing*s);CX.stroke();
      CX.beginPath();CX.moveTo(s*0.2,s*1.4);CX.lineTo(s*0.5,s*2.1-legSwing*s);CX.stroke();
      
      CX.fillStyle='#000';CX.beginPath();CX.arc(-s*0.2,-s*0.35,s*0.18,0,6.2832);CX.fill();
      CX.beginPath();CX.arc(s*0.2,-s*0.35,s*0.18,0,6.2832);CX.fill();
      
      const gi=.5+Math.sin(a.eye)*.4;if(gi>.5){CX.globalAlpha=gi*.15;CX.fillStyle='#ff0';CX.beginPath();CX.arc(-s*.2,-s*.35,s*.12,0,6.2832);CX.fill();CX.beginPath();CX.arc(s*.2,-s*.35,s*.12,0,6.2832);CX.fill();}
    }
    if(S.showHelpAliens){
      const pulse=Math.sin(Date.now()/300)*3+8;
      CX.strokeStyle='#ff0000';
      CX.lineWidth=5;
      CX.beginPath();
      CX.arc(0,0,s+pulse,0,6.2832);
      CX.stroke();
    }
    CX.globalAlpha=1;CX.restore();
  }
}

function drawOverview(){CX.fillStyle='#000';CX.fillRect(0,0,W,H);
  CX.save();CX.translate(W/2-S.cx*S.zoom,H/2-S.cy*S.zoom);CX.scale(S.zoom,S.zoom);CX.beginPath();CX.rect(0,0,CFG.WORLD_W,CFG.WORLD_H);CX.clip();drawWorld(LV[S.levelIdx]);drawAliens();CX.restore();}

function drawScope(){const SR=Math.min(W,H)*.42;
  CX.fillStyle='#000';CX.fillRect(0,0,W,H);CX.save();CX.beginPath();CX.arc(W/2,H/2,SR,0,6.2832);CX.clip();
  CX.save();CX.translate(W/2-S.cx*S.zoom,H/2-S.cy*S.zoom);CX.scale(S.zoom,S.zoom);CX.beginPath();CX.rect(0,0,CFG.WORLD_W,CFG.WORLD_H);CX.clip();drawWorld(LV[S.levelIdx]);drawAliens();CX.restore();CX.restore();
  CX.strokeStyle='#111';CX.lineWidth=12;CX.beginPath();CX.arc(W/2,H/2,SR,0,6.2832);CX.stroke();
  CX.strokeStyle='rgba(255,68,68,.8)';CX.lineWidth=1.3;const gap=20,len=SR-14;CX.beginPath();CX.moveTo(W/2-len,H/2);CX.lineTo(W/2-gap,H/2);CX.stroke();CX.beginPath();CX.moveTo(W/2+gap,H/2);CX.lineTo(W/2+len,H/2);CX.stroke();CX.beginPath();CX.moveTo(W/2,H/2-len);CX.lineTo(W/2,H/2-gap);CX.stroke();CX.beginPath();CX.moveTo(W/2,H/2+gap);CX.lineTo(W/2,H/2+len);CX.stroke();
  [.25,.5,.75].forEach(t=>{const d=t*len;CX.fillStyle='rgba(255,68,68,.45)';CX.beginPath();CX.arc(W/2+d,H/2,1.5,0,6.2832);CX.fill();CX.beginPath();CX.arc(W/2-d,H/2,1.5,0,6.2832);CX.fill();CX.beginPath();CX.arc(W/2,H/2+d,1.5,0,6.2832);CX.fill();CX.beginPath();CX.arc(W/2,H/2-d,1.5,0,6.2832);CX.fill();});
  CX.fillStyle='#ff4444';CX.beginPath();CX.arc(W/2,H/2,2.2,0,6.2832);CX.fill();
  if(S.muzzle>0){CX.fillStyle=`rgba(255,200,50,${S.muzzle/14})`;CX.beginPath();for(let i=0;i<8;i++){const a=i/8*6.2832,r=S.muzzle*(2+Math.random()*4);CX.lineTo(W/2+Math.cos(a)*r+3,H/2+Math.sin(a)*r+4);}CX.closePath();CX.fill();S.muzzle--;}S.recoilX*=.75;S.recoilY*=.75;}

// ============================================================
// HUD — with BIG debug text
// ============================================================
function drawHUD(){
  CX.fillStyle='rgba(0,0,0,.6)';CX.fillRect(0,0,W,44);
  CX.fillStyle='#ffcc00';CX.font='bold 20px "Microsoft YaHei",sans-serif';CX.textAlign='left';CX.fillText('得分: '+S.score,14,29);
  CX.textAlign='center';CX.fillStyle='#88bbff';CX.font='15px "Microsoft YaHei",sans-serif';CX.fillText(LV[S.levelIdx].name+' · 波'+S.wave+' · '+(S.mode==='sniper'?'狙击':'全景'),W/2,29);
  let h='';for(let i=0;i<S.lives;i++)h+='❤';CX.fillStyle='#ff4444';CX.textAlign='right';CX.font='15px Arial';CX.fillText(h,W-14,29);

  CX.fillStyle='rgba(0,0,0,.8)';CX.fillRect(W/2-120,H-70,240,28);
  const timeLeft=Math.floor(S.timeLeft);
  const timeColor=timeLeft<=20?'#ff0000':'#ff0';
  CX.fillStyle=timeColor;CX.font='bold 16px "Microsoft YaHei",sans-serif';CX.textAlign='center';CX.fillText('已杀:'+S.killsInWave+' 剩余:'+S.aliensRemaining+' 计时:'+timeLeft+'s '+S.debugMsg,W/2,H-46);

  CX.fillStyle='rgba(0,0,0,.4)';CX.fillRect(W/2-80,48,160,22);
  const totalDots=Math.min(S.waveTotal,10);
  for(let i=0;i<totalDots;i++){
    if(i<S.killsInWave){
      CX.fillStyle='#4f4';
    }else{
      CX.fillStyle='#f44';
    }
    CX.beginPath();CX.arc(W/2-70+i*14,59,5,0,6.2832);CX.fill();
  }

  if(S.mode==='sniper'){CX.textAlign='left';CX.fillStyle=S.ammo<=2?'#ff4444':'#aabbcc';CX.font='bold 16px "Microsoft YaHei",sans-serif';CX.fillText(S.reloading?'装弹...':'弹: '+'●'.repeat(S.ammo)+'○'.repeat(8-S.ammo),14,H-14);}

  for(let i=S.hits.length-1;i>=0;i--){const m=S.hits[i];m.y+=m.vy;m.life-=.02;if(m.life<=0){S.hits.splice(i,1);continue;}CX.save();CX.globalAlpha=m.life;CX.fillStyle=m.c;CX.font='bold 20px "Microsoft YaHei",sans-serif';CX.textAlign='center';CX.fillText(m.t,m.x,m.y);CX.restore();}
  for(let i=S.fx.length-1;i>=0;i--){const p=S.fx[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=p.dec;if(p.life<=0){S.fx.splice(i,1);continue;}CX.save();CX.globalAlpha=p.life;CX.fillStyle=p.color;CX.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);CX.restore();}
}

function updateCamera(){if(S.paused)return;
  const tw=(S.mx/W)*CFG.WORLD_W,th=(S.my/H)*CFG.WORLD_H,hw=W/(S.zoom*2),hh=H/(S.zoom*2),pad=S.mode==='sniper'?.05:.5;
  S.tcx=Math.max(hw*pad,Math.min(CFG.WORLD_W-hw*pad,tw));S.tcy=Math.max(hh*pad,Math.min(CFG.WORLD_H-hh*pad,th));
  const lerp=S.mode==='sniper'?.3:.1;S.cx+=(S.tcx-S.cx)*lerp;S.cy+=(S.tcy-S.cy)*lerp;S.zoom+=(S.tzoom-S.zoom)*.1;S.cx+=S.recoilX/S.zoom;S.cy+=S.recoilY/S.zoom;
  if(S.holdingBreath){S.breath-=16;if(S.breath<=0)S.holdingBreath=0;}else S.breath=Math.min(3500,S.breath+18);}
function toggleMode(){if(S.phase!=='playing'||S.paused||settingsOpen||helpOpen)return;
  if(S.mode==='overview'){S.mode='sniper';S.tzoom=2.5;S.holdingBreath=0;$('sniperHint').classList.remove('show');$('reloadHint').classList.remove('show');}
  else{S.mode='overview';S.tzoom=1;$('sniperHint').classList.add('show');}}

// ============================================================
// MAIN LOOP
// ============================================================
function loop(){
  try{
    const nw=window.innerWidth,nh=window.innerHeight;if(nw!==W||nh!==H){W=nw;H=nh;CV.width=W;CV.height=H;}
    CX.fillStyle='#000';CX.fillRect(0,0,W,H);

    if(S.phase==='menu'){
      CX.save();CX.translate(W/2-S.cx*S.zoom,H/2-S.cy*S.zoom);CX.scale(S.zoom,S.zoom);drawWorld(LV[0]);CX.restore();
      CX.fillStyle='rgba(0,0,0,.65)';CX.fillRect(0,0,W,H);
    }else if(S.phase==='playing'){
      // WAVE TIMER
      if(S.waveTimer>0){
        S.waveTimer--;
        if(S.waveTimer===0){
          if(S.waveCleared){
            console.log('TIMER: calling clearWave (waveCleared flag)');
            S.waveCleared=false;
            clearWave();
          }else{
            console.log('TIMER: starting initial wave');
            startInitialWave();
          }
        }
      }
      if(!S.paused){
      updateDynamic();
      S.gameTime+=16;
      if(S.lastWave!==S.wave){
        S.timeLeft=300;
        S.lastWave=S.wave;
      }
      const lastTime=Math.floor(S.timeLeft);
      S.timeLeft=Math.max(0,S.timeLeft-16/1000);
      const currTime=Math.floor(S.timeLeft);
      if(currTime<=20&&lastTime!==currTime){
        play('tick');
      }
      if(S.timeLeft<=0){
        gameOver();
      }
    }else{
      updateDynamic();
    }
      updateCamera();
      if(S.mode==='overview')drawOverview();else drawScope();
      drawHUD();
    }else if(S.phase==='gameover'||S.phase==='win'){
      if(S.mode==='overview')drawOverview();else drawScope();drawHUD();CX.fillStyle='rgba(0,0,0,.6)';CX.fillRect(0,0,W,H);
      if(S.phase==='gameover')for(let i=0;i<S.aliens.length;i++){const a=S.aliens[i];if(!a.alive)continue;const s=w2s(a.x,a.y);CX.fillStyle='#ff0000';CX.beginPath();CX.arc(s.x,s.y,7,0,6.2832);CX.fill();CX.strokeStyle='#fff';CX.lineWidth=1;CX.beginPath();CX.arc(s.x,s.y,13,0,6.2832);CX.stroke();}
    }
  }catch(e){console.error(e);}
  requestAnimationFrame(loop);}
